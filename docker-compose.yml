services:
  postgres:
    image: postgres:16
    container_name: hackathon-db
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon"]
      interval: 5s
      timeout: 3s
      retries: 10
