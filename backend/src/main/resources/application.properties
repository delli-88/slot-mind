spring.application.name=hackathon
server.port=8080

# H2 (default profile)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:hackathon
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
# Entities never reach the view layer; services return DTOs.
spring.jpa.open-in-view=false

# Timestamps are ISO-8601 UTC strings (DESIGN.md section 3)
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator
management.endpoints.web.exposure.include=health,info

# LLM key comes from the environment; the app starts without one.
llm.api.key=${LLM_API_KEY:}

# SlotMind
# Scheduling strategy used when a request does not override it: ai | rule
slotmind.scheduling.strategy=ai
# Load the Addendum A demo data at startup (skipped when providers already exist)
slotmind.seed.enabled=true
# Zone used when formatting slot times for prompts and patient-facing text
slotmind.clinic-zone=UTC
